services:
  opencode:
    build: .
    environment:
      - 'OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}'
    volumes:
      - opencode-data:/root/.local/share/opencode
    networks:
      - coolify
    restart: unless-stopped
    expose:
      - '4096'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:4096/global/health | grep -qE '^(200|401)$' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  coolify:
    external: true
volumes:
  opencode-data:
