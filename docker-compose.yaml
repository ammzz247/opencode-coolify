services:
  opencode:
    build: .
    container_name: opencode-server
    ports:
      - '4096:4096'
    environment:
      - 'OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}'
    volumes:
      - opencode-data:/root/.local/share/opencode  # persists auth + db
    networks:
      - coolify
    restart: unless-stopped

networks:
  coolify:
    external: true

volumes:
  opencode-data:
